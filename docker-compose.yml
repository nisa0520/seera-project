services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seera
      POSTGRES_PASSWORD: seera_pass
      POSTGRES_DB: seera_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seera -d seera_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  pgadmin:
    image: dpage/pgadmin4:8.14
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@seera.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://seera:seera_pass@postgres:5432/seera_db
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://127.0.0.1,http://localhost:5173"
      APP_ENV: production
      # Realistic try-on default model = IDM-VTON (yisol), fallback = CatVTON.
      # Mode inference: "space" = HuggingFace Space (butuh internet/kuota GPU),
      # "http" = worker GPU internal, "mock" = demo tanpa GPU.
      VTON_INFERENCE_MODE: ${VTON_INFERENCE_MODE:-space}
      VTON_HF_TOKEN: ${VTON_HF_TOKEN:-}
      VTON_MODEL_PROVIDER: ${VTON_MODEL_PROVIDER:-yisol}
      VTON_MODEL_REPO: ${VTON_MODEL_REPO:-yisol/IDM-VTON}
      VTON_SPACE_ID: ${VTON_SPACE_ID:-yisol/IDM-VTON}
      VTON_FALLBACK_MODEL: ${VTON_FALLBACK_MODEL:-catvton}
      VTON_ALLOW_EXPERIMENTAL_ASSET_MODE: ${VTON_ALLOW_EXPERIMENTAL_ASSET_MODE:-true}
      VTON_BLOCK_UNSUPPORTED_ASSETS: ${VTON_BLOCK_UNSUPPORTED_ASSETS:-true}
      VTON_ENABLE_DEBUG_ARTIFACTS: ${VTON_ENABLE_DEBUG_ARTIFACTS:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_data:
  pgadmin_data:
