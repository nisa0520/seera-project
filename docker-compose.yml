services:
  postgres:
    image: postgres:16
    container_name: seera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seera_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seera_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seera-network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: seera-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@seera.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - seera-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  seera-network:
    driver: bridge
